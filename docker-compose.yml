version: '3.8'

services:
  fastapi-research:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-deep-research-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # API Keys - Set these via .env file or environment variables
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # - GROQ_API_KEY=${GROQ_API_KEY:-}
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      
      # API Base URLs (optional, defaults to official APIs)
      # - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      # - ANTHROPIC_API_BASE_URL=${ANTHROPIC_API_BASE_URL:-}
      
      # LangSmith (optional)
      # - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      # - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-}
      # - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      
      # Supabase Auth (optional)
      # - SUPABASE_URL=${SUPABASE_URL:-}
      # - SUPABASE_KEY=${SUPABASE_KEY:-}
      
      # Configuration flags
      - GET_API_KEYS_FROM_CONFIG=${GET_API_KEYS_FROM_CONFIG:-true}
      - GET_API_BASE_URL_FROM_CONFIG=${GET_API_BASE_URL_FROM_CONFIG:-true}
      
      # Server configuration
      - PORT=8000
    # volumes:
      # Mount .env file if you want to use it (optional)
      # - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - research-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  research-network:
    driver: bridge

